<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hivemindle</title>

    <!-- Google tag (gtag.js)

    <!-- favicon configs -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/public/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut-icon" href="/public/favicon.ico" />
    <meta name="msapplication-TileColor" content="#dcdcdc" />
    <meta name="msapplication-config" content="/public/browserconfig.xml" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" href="styles/game.css" />
    <link rel="stylesheet" href="styles/overlay.css" />
    <link rel="stylesheet" href="styles/global.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    />

    <script
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"
      defer
    ></script>
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <div id="main-page">
      <header id="site-header">
        <div id="header-container">
          <button id="info-button" data-overlay="info-overlay" type="button">
            ?
          </button>
          <h1 id="title" class="title hivemindle">
            <div class="center">Hivemindle</div>
          </h1>
          <button id="stats-button" data-overlay="stats-overlay" type="button">
            <!--<img src="/assets/stats-logo.png" alt="Stats" style="height: 10%; width: 13%"/>-->
            Stats
          </button>
        </div>
      </header>
      <main id="game-container">
        <div id="share-toast" class="animate__animated hide">
          <div class="center">Results copied to clipboard</div>
        </div>
        <div id="info-card" class="animate__animated">
          <div id="title-container"></div>
          <div id="text-container"></div>
        </div>
        <div id="game-stats"></div>
        <div id="NTA-guess-container">
          <div id="warning-toast" class="animate__animated hide">
            <div class="center">Invalid guess</div>
          </div>
          <div id="1NTA" class="guess-container"></div>
          <div id="2NTA" class="guess-container"></div>
          <div id="3NTA" class="guess-container"></div>
          <div id="4NTA" class="guess-container"></div>
          <div id="5NTA" class="guess-container"></div>
          <div id="6NTA" class="guess-container"></div>
          <div
            id="input-container"
            class="guess-container transparent-background"
          >
            <div id="text-input-container">
              <div id="input-label">%</div>
              <input
                id="NTA-guess-input"
                type="text"
                placeholder="Enter a guess..."
              />
            </div>
          </div>
        </div>
        <div id="YTA-guess-container">
          <div id="warning-toast" class="animate__animated hide">
            <div class="center">Invalid guess</div>
          </div>
          <div id="1YTA" class="guess-container"></div>
          <div id="2YTA" class="guess-container"></div>
          <div id="3YTA" class="guess-container"></div>
          <div id="4YTA" class="guess-container"></div>
          <div id="5YTA" class="guess-container"></div>
          <div id="6YTA" class="guess-container"></div>
          <div
            id="input-container"
            class="guess-container transparent-background"
          >
            <div id="text-input-container">
              <div id="input-label">%</div>
              <input
                id="YTA-guess-input"
                type="text"
                placeholder="Enter a guess..."
              />
            </div>
          </div>
        </div>
        <div id="ESH-guess-container">
          <div id="warning-toast" class="animate__animated hide">
            <div class="center">Invalid guess</div>
          </div>
          <div id="1ESH" class="guess-container"></div>
          <div id="2ESH" class="guess-container"></div>
          <div id="3ESH" class="guess-container"></div>
          <div id="4ESH" class="guess-container"></div>
          <div id="5ESH" class="guess-container"></div>
          <div id="6ESH" class="guess-container"></div>
          <div
            id="input-container"
            class="guess-container transparent-background"
          >
            <div id="text-input-container">
              <div id="input-label">%</div>
              <input
                id="ESH-guess-input"
                type="text"
                placeholder="Enter a guess..."
              />
            </div>
          </div>
        </div>
        <div id="NAH-guess-container">
          <div id="warning-toast" class="animate__animated hide">
            <div class="center">Invalid guess</div>
          </div>
          <div id="1NAH" class="guess-container"></div>
          <div id="2NAH" class="guess-container"></div>
          <div id="3NAH" class="guess-container"></div>
          <div id="4NAH" class="guess-container"></div>
          <div id="5NAH" class="guess-container"></div>
          <div id="6NAH" class="guess-container"></div>
          <div
            id="input-container"
            class="guess-container transparent-background"
          >
            <div id="text-input-container">
              <div id="input-label">%</div>
              <input
                id="NAH-guess-input"
                type="text"
                placeholder="Enter a guess..."
              />
            </div>
            <div id="button-container">
              <button id="guess-button" class="active">SUBMIT</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
